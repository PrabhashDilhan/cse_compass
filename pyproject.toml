    "gradio>=6.5.1",
    "ipython>=9.10.0",
    "langchain>=1.2.10",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.1",
    "langchain-core>=1.2.12",
    "langchain-mcp-adapters>=0.2.1",
    "langchain-openai>=1.1.9",
    "langchain-text-splitters>=1.1.0",
    "langgraph>=1.0.8",
    "pathlib>=1.0.1",
    "pydantic>=2.12.5",
    "pypdf>=6.7.0",
    "sendgrid>=6.12.5",
    "typing>=3.10.0.0",
]
